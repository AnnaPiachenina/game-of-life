<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game of Life</title>
  <style>
    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #aacc0039;
        margin-top: 2em;
    }
    h1 {
        font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        font-size: 60px;
        margin: 0;
        color: #ff6287d8;
        letter-spacing: -2px;
        -webkit-text-stroke: 3px #da2d55e4;
    }
    
    .button-container {
        display: flex;
    }
    button {
        width: 5em;
        height: 2em;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        text-decoration: none;
        margin: 0.5em;
        font-size: 25px;
        background-color: #fcdaae;
        border: 3px solid #ff9252;
        color: #ff612c;
        border-radius: 10px;
    }
    .canvas-style {
        background-color: #b9e9e5cd;
        padding: 1em;
        margin-top: 1em;
        border: 5px solid #17c3b2;
        border-radius: 20px;
    }

  </style>
</head>
<body>
    <h1>Game of life!</h1>
    <canvas id="gameCanvas" width="400" height="400" class="canvas-style"></canvas>
    <div id="generation" style="margin-top: 0.5em; font-family: Calibri, sans-serif; color: #333;">Generation: 0</div>
    <div class="button-container" >
        <button onclick="start()">Start</button>
        <button onclick="stop()">Stop</button>
        <button onclick="reset()">Reset</button>
    </div>

    <div style="margin-top: 1em; font-family: Calibri, sans-serif; color: #333;">
        <label style="cursor: pointer;">
            <input type="checkbox" id="restrictedCheckbox" />
            Restricted control (Region 08 users only)
        </label>
        <div id="checkboxInfo" style="font-size: 0.9em; color: #555; margin-top: 0.25em;"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const numRows = 60;
        const numCols = 60;
        const cellSize = 8;
        const worker = new Worker('worker.js');

        let isRunning = false;
        let generation = 0;

        const AUTH_REGION_CODE = '08';

        function getCurrentUser() {
            const globalUser = (window.currentUser && typeof window.currentUser === 'object') ? window.currentUser : {};
            const params = new URLSearchParams(window.location.search);

            const loggedInFromGlobal = globalUser.isLoggedIn ?? globalUser.loggedIn ?? globalUser.authenticated;
            const regionFromGlobal = globalUser.regionCode ?? globalUser.region;

            const loggedInFromParams = (() => {
                const v = params.get('loggedIn');
                if (v === null) return undefined;
                return v === '1' || v === 'true';
            })();
            const regionFromParams = params.get('region') ?? undefined;

            const isLoggedIn = Boolean(loggedInFromGlobal !== undefined ? loggedInFromGlobal : (loggedInFromParams ?? false));
            const regionRaw = (regionFromGlobal !== undefined ? String(regionFromGlobal) : String(regionFromParams ?? ''));
            const regionCode = regionRaw ? regionRaw.padStart(2, '0') : '';

            return { isLoggedIn, regionCode };
        }

        function isAuthorizedToControlCheckbox() {
            const user = getCurrentUser();
            return user.isLoggedIn && user.regionCode === AUTH_REGION_CODE;
        }

        function initRestrictedCheckbox() {
            const checkbox = document.getElementById('restrictedCheckbox');
            const info = document.getElementById('checkboxInfo');
            if (!checkbox || !info) return;

            const authorized = isAuthorizedToControlCheckbox();
            checkbox.disabled = !authorized;
            info.textContent = authorized
                ? 'You are authorized to control this checkbox.'
                : 'You must be logged in and in region 08 to change this.';
        }

        function initGrid() {
        const grid = new Array(numRows).fill(null)
            .map(() => new Array(numCols).fill(false));

        return grid.map(row => row.map(() => Math.random() > 0.7));
        }

        let currentGrid = initGrid();

        function drawGrid() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < numRows; i++) {
            for (let j = 0; j < numCols; j++) {
            if (currentGrid[i][j]) {
                ctx.fillStyle = getRandomColor();
                ctx.fillRect(j * cellSize, i * cellSize, cellSize, cellSize);
            }
            }
        }
        }

        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
              color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        function updateGrid(newGrid) {
        currentGrid = newGrid;
        drawGrid();
        document.getElementById('generation').innerText = `Generation: ${generation++}`;
        }

        function start() {
        if (!isRunning) {
            isRunning = true;
            worker.postMessage({ type: 'start', grid: currentGrid });
        }
        }

        function stop() {
        if (isRunning) {
            isRunning = false;
            worker.postMessage({ type: 'stop' });
        }
        }

        function reset() {
        stop();
        currentGrid = initGrid();
        generation = 0;
        drawGrid();
        }

        worker.onmessage = (event) => {
        if (event.data.type === 'update') {
            updateGrid(event.data.grid);
        }
        };

        drawGrid();
        initRestrictedCheckbox();
    </script>
    <script src="worker.js"></script>
</body>
</html>
